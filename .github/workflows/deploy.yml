name: Deploy preview to Azure

# Every push to main redeploys the client preview. This is a temporary
# environment; when the site moves to the customer's own infrastructure this
# workflow and the Azure resources can both be deleted.
on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

# Never let two deploys race. cancel-in-progress is off so an in-flight deploy
# finishes rather than leaving the app half-written.
concurrency:
  group: deploy-azure-preview
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: amaliautama-preview
  AZURE_RESOURCE_GROUP: rg-temuin
  # Drives canonical and Open Graph URLs. Override with a repository variable
  # named SITE_URL when the site moves to its real domain.
  SITE_URL: ${{ vars.SITE_URL || 'https://amaliautama-preview.azurewebsites.net' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ vars.SITE_URL || 'https://amaliautama-preview.azurewebsites.net' }}

    permissions:
      # Required for the OIDC token exchange with Entra ID. No client secret is
      # stored anywhere; Azure trusts a token minted for this repo and branch.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Stage deployment package
        # The deploy/ folder is the hosting shim: a static server plus the CMS
        # OAuth endpoints. It has no dependencies, so there is nothing to
        # install on the App Service side.
        run: |
          mkdir -p package
          cp deploy/server.mjs deploy/auth.mjs deploy/package.json package/
          cp -r dist package/dist

      - name: Verify the package is complete
        # An incomplete package would deploy a broken site, so fail loudly here
        # rather than after it is live. server.mjs imports auth.mjs, so a
        # missing file here would crash the app on boot.
        run: |
          test -f package/server.mjs
          test -f package/auth.mjs
          test -f package/package.json
          test -f package/dist/index.html
          test -f package/dist/about/index.html
          test -f package/dist/admin/index.html
          echo "package contains $(find package -type f | wc -l) files"

      - name: Check Azure credentials are configured
        # azure/login fails with a vague message when these are absent, which
        # is the most likely first-run problem. Say so plainly instead.
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "See the Continuous deployment section of README.md for the values."
            exit 1
          fi
          echo "All Azure credentials present."

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          cd package
          zip -rq ../package.zip .
          cd ..
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path package.zip \
            --type zip

      - name: Smoke-test the live site
        # Deployment reporting success is not the same as the site serving, so
        # poll the real URL and fail the run if it never comes back healthy.
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL}/" || true)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Live at ${SITE_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "Site did not return HTTP 200 after deployment"
          exit 1
