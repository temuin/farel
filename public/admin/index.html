<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager — Amalia Utama</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      /* Sign-in happens on this page rather than in Decap's own screen, so
         staff never see a GitHub button or a second window. */
      #signin { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #f5f5f5; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #202020; }
      #signin .card { width: min(360px, calc(100vw - 32px)); background: #fff; padding: 28px;
        border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
      #signin h1 { margin: 0 0 4px; font-size: 18px; }
      #signin p.sub { margin: 0 0 20px; color: #6b6b6b; font-size: 13px; }
      #signin label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      #signin input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
        border: 1px solid #d4d4d4; border-radius: 10px; margin-bottom: 14px; }
      #signin input:focus { outline: 2px solid #095d3e; outline-offset: 1px; border-color: #095d3e; }
      #signin button { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
        border: 0; border-radius: 999px; background: #095d3e; color: #fff; }
      #signin button:hover { background: #06462f; }
      #signin button[disabled] { opacity: .6; cursor: progress; }
      #signin-error { background: #fdecec; color: #8c1c1c; border: 1px solid #f5c2c2;
        padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
      [hidden] { display: none !important; }

      /* Photo picker. Sits above Decap's own modals, hence the z-index. */
      #r2 { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column;
        background: rgba(15,23,20,.55); backdrop-filter: blur(2px);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #r2 .panel { margin: auto; width: min(940px, calc(100vw - 32px)); max-height: calc(100vh - 64px);
        display: flex; flex-direction: column; background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 24px 60px rgba(0,0,0,.28); }
      #r2 header { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
        border-bottom: 1px solid #e6e6e6; }
      #r2 h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
      #r2 .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600;
        cursor: pointer; background: #095d3e; color: #fff; }
      #r2 .btn:hover { background: #06462f; }
      #r2 .btn.ghost { background: #f0f0f0; color: #333; }
      #r2 .btn.ghost:hover { background: #e2e2e2; }
      #r2 .btn[disabled] { opacity: .55; cursor: progress; }
      #r2 .body { padding: 18px 20px; overflow-y: auto; }
      #r2 .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      #r2 figure { margin: 0; border: 1px solid #e2e2e2; border-radius: 10px; overflow: hidden;
        background: #fafafa; position: relative; }
      #r2 figure button.pick { display: block; width: 100%; border: 0; padding: 0; background: none; cursor: pointer; }
      #r2 figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; }
      #r2 figure:hover { border-color: #095d3e; }
      #r2 figure:focus-within { outline: 2px solid #095d3e; outline-offset: 1px; }
      #r2 figcaption { padding: 7px 9px; font-size: 11px; color: #555; word-break: break-all; text-align: left; }
      #r2 .del { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; cursor: pointer;
        background: rgba(255,255,255,.94); color: #8c1c1c; font-size: 11px; font-weight: 600; padding: 4px 7px; }
      #r2 .del:hover { background: #fdecec; }
      #r2 .note { padding: 26px 4px; color: #666; font-size: 13px; text-align: center; }
      #r2 .err { margin: 0 20px 14px; background: #fdecec; color: #8c1c1c; border: 1px solid #f5c2c2;
        padding: 9px 12px; border-radius: 9px; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        #r2 .panel { background: #1c1c1c; color: #f0f0f0; }
        #r2 header { border-color: #333; }
        #r2 figure { background: #232323; border-color: #333; }
        #r2 figcaption { color: #bbb; }
        #r2 .btn.ghost { background: #333; color: #eee; }
        #r2 .del { background: rgba(30,30,30,.94); color: #f09a9a; }
      }
    </style>
  </head>
  <body>
    <div id="signin">
      <main class="card">
        <h1>Content Manager</h1>
        <p class="sub">Sign in to edit the website.</p>
        <div id="signin-error" role="alert" hidden></div>
        <form id="signin-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Login</button>
        </form>
      </main>
    </div>

    <!--
      Order matters here, and both parts are load-bearing:
        1. CMS_MANUAL_INIT must be set BEFORE the bundle loads, or Decap
           auto-initialises and fetches a config.yml that does not exist.
        2. The bundle must load inside <body>, not <head> — it mounts itself on
           document.body as it evaluates, and crashes if body is not there yet.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!--
      Pinned by content, not just by version number. This page holds a GitHub
      write token in localStorage, so a tampered bundle from the CDN would be
      the single worst thing that could happen to it. The hash below was taken
      from the npm registry tarball for decap-cms@3.15.1 and confirmed
      byte-identical to what unpkg serves; the browser refuses to run anything
      that does not match it. Recompute it if the version above ever changes:
        npm pack decap-cms@<version>
        openssl dgst -sha384 -binary package/dist/decap-cms.js | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
      integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      /*
       * Configured here rather than in a static config.yml so `base_url` can be
       * the current origin. The OAuth endpoints are served by this same site,
       * and the site moves hosts (Azure preview now, Cloudflare Pages later,
       * then a custom domain) — reading the origin at runtime means the admin
       * keeps working across all of them with no rebuild.
       */
      const BRANDS = ['Kelme', 'Adidas'];
      const CATEGORIES = ['Jerseys', 'Tops', 'Bottoms', 'Footwear', 'Accessories'];

      const CMS_CONFIG = {
        config: {
          // Everything is defined here, so stop Decap probing for a
          // config.yml that does not exist and 404ing on every load.
          load_config_file: false,

          backend: {
            name: 'github',
            repo: 'temuin/farel',
            branch: 'main',
            // Points Decap at this site's own OAuth endpoints instead of
            // Netlify's shared broker.
            base_url: window.location.origin,
            auth_endpoint: 'api/auth',
            commit_messages: {
              create: 'Add {{collection}} "{{slug}}" via CMS',
              update: 'Update {{collection}} "{{slug}}" via CMS',
              delete: 'Delete {{collection}} "{{slug}}" via CMS',
              uploadMedia: 'Upload "{{path}}" via CMS',
              deleteMedia: 'Delete "{{path}}" via CMS',
            },
          },

          /*
           * Product photos live in src/assets so Astro can optimise them at
           * build time. public_folder is the relative path written into the
           * markdown, matching what the content schema's image() helper
           * resolves from src/content/products/.
           */
          /*
           * Every image widget uploads to the R2 bucket through /api/media.
           *
           * This has to be declared here rather than per field: Decap only
           * instantiates an external media library from the top-level name,
           * and a `media_library` on a field carries options, never a
           * different library. So testimonial logos go to the bucket too.
           * That is fine -- they are stored as absolute URLs and rendered as
           * plain <img>, which is why the site's CSP allows the media host.
           */
          media_library: { name: 'r2' },

          /*
           * Unused while the R2 library is active, but left in place: remove
           * them and Decap fails config validation, which requires one of
           * media_folder or media_library and gives a cryptic error when the
           * external library has not finished registering.
           */
          media_folder: 'src/assets/products',
          public_folder: '../../assets/products',

          // Saves land straight on main, which is what triggers the deploy.
          publish_mode: 'simple',

          collections: [
            {
              name: 'products',
              label: 'Products',
              label_singular: 'Product',
              description:
                'Everything in the catalogue. Each product needs at least one photo.',
              folder: 'src/content/products',
              create: true,
              // Keeps the filename in step with the slug field.
              slug: '{{fields.slug}}',
              identifier_field: 'name',
              extension: 'md',
              format: 'frontmatter',
              summary: '{{name}} — {{brand}} / {{category}}',
              sortable_fields: ['name', 'brand', 'category'],
              fields: [
                { name: 'name', label: 'Product name', widget: 'string' },
                { name: 'brand', label: 'Brand', widget: 'select', options: BRANDS },
                { name: 'category', label: 'Category', widget: 'select', options: CATEGORIES },
                {
                  name: 'slug',
                  label: 'URL slug',
                  widget: 'string',
                  hint: 'Lowercase words separated by single hyphens, e.g. adidas-home-jersey. Changing this changes the page address.',
                  pattern: [
                    '^[a-z0-9]+(?:-[a-z0-9]+)*$',
                    'Use lowercase letters, numbers and single hyphens only',
                  ],
                },
                {
                  name: 'description',
                  label: 'Short description',
                  widget: 'text',
                  hint: 'One line. Shown on the product card and used as the page description in Google results. Max 200 characters.',
                  pattern: ['^.{1,200}$', 'Keep this to 200 characters or fewer'],
                },
                {
                  name: 'images',
                  label: 'Photos',
                  label_singular: 'Photo',
                  widget: 'list',
                  field: { name: 'image', label: 'Photo', widget: 'image' },
                  hint: 'The first photo is used on the product card and when the page is shared on WhatsApp or social media. Upload the original at full size - the website makes its own smaller copies.',
                },
                {
                  name: 'featured',
                  label: 'Feature on the homepage',
                  widget: 'boolean',
                  default: false,
                  required: false,
                },
                {
                  name: 'body',
                  label: 'Full description',
                  widget: 'markdown',
                  required: false,
                  hint: 'The longer text on the product page. Bullet lists work well for specs and sizing.',
                },
              ],
            },

            {
              name: 'content',
              label: 'Site content',
              files: [
                {
                  name: 'testimonials',
                  label: 'Testimonials',
                  file: 'src/data/testimonials.json',
                  description: 'Client quotes shown on the homepage.',
                  fields: [
                    {
                      name: 'items',
                      label: 'Testimonials',
                      label_singular: 'Testimonial',
                      widget: 'list',
                      fields: [
                        { name: 'quote', label: 'Quote', widget: 'text' },
                        {
                          name: 'role',
                          label: 'Person’s role',
                          widget: 'string',
                          hint: 'e.g. Team Manager',
                        },
                        { name: 'organisation', label: 'Organisation', widget: 'string' },
                        {
                          name: 'logo',
                          label: 'Organisation logo',
                          widget: 'image',
                          required: false,
                          hint: 'Optional. Shown instead of the initials chip. Leave blank to fall back to initials.',
                        },
                        {
                          name: 'videoUrl',
                          label: 'Video link',
                          widget: 'string',
                          required: false,
                          hint: 'Optional. Paste a YouTube or Vimeo link and the video appears on the card. Leave blank for a text-only testimonial.',
                        },
                      ],
                    },
                  ],
                },
                {
                  name: 'settings',
                  label: 'Company details',
                  file: 'src/data/settings.json',
                  description:
                    'Company name, contact details and address. These appear in the header, footer, contact page and WhatsApp links.',
                  fields: [
                    { name: 'name', label: 'Company name', widget: 'string' },
                    {
                      name: 'legalName',
                      label: 'Legal entity name',
                      widget: 'string',
                      hint: 'The registered name, used in the footer copyright.',
                    },
                    {
                      name: 'tagline',
                      label: 'Tagline',
                      widget: 'string',
                      hint: 'The short line under the logo.',
                    },
                    {
                      name: 'description',
                      label: 'Site description',
                      widget: 'text',
                      hint: 'Used by Google and link previews. Aim for one or two sentences.',
                    },
                    { name: 'foundedYear', label: 'Year founded', widget: 'number', value_type: 'int' },
                    {
                      name: 'web3formsAccessKey',
                      label: 'Contact form access key',
                      widget: 'string',
                      required: false,
                      hint: 'Paste the free access key from web3forms.com to switch on the enquiry form on the contact page. Leave blank and the page shows WhatsApp and email instead.',
                    },
                    {
                      name: 'contact',
                      label: 'Contact',
                      widget: 'object',
                      fields: [
                        {
                          name: 'whatsappNumber',
                          label: 'WhatsApp number',
                          widget: 'string',
                          hint: 'Digits only, including country code, e.g. 6281234567890. No +, spaces or dashes.',
                          pattern: ['^[0-9]{8,15}$', 'Digits only, 8–15 characters'],
                        },
                        {
                          name: 'phoneDisplay',
                          label: 'Phone number as displayed',
                          widget: 'string',
                          hint: 'How it should look on the page, e.g. +62 812-3456-7890',
                        },
                        {
                          name: 'email',
                          label: 'Email (general / marketing)',
                          widget: 'string',
                          hint: 'The primary address — used for mailto links in the footer and contact form.',
                        },
                        {
                          name: 'adminEmail',
                          label: 'Email (admin)',
                          widget: 'string',
                          required: false,
                          hint: 'Shown as a second contact option on the Contact page. Leave blank to show only the address above.',
                        },
                        { name: 'openingHours', label: 'Opening hours', widget: 'string' },
                        {
                          name: 'address',
                          label: 'Address',
                          widget: 'object',
                          hint: 'Also drives the map on the contact page.',
                          fields: [
                            { name: 'street', label: 'Street', widget: 'string' },
                            { name: 'district', label: 'District', widget: 'string' },
                            { name: 'city', label: 'City', widget: 'string' },
                            { name: 'province', label: 'Province', widget: 'string' },
                            { name: 'postalCode', label: 'Postal code', widget: 'string' },
                            { name: 'country', label: 'Country', widget: 'string' },
                          ],
                        },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        },
      };

      /** Where Decap keeps the signed-in user, and where the picker reads the token from. */
      const AUTH_KEY = 'decap-cms-user';

      /*
       * Photo picker backed by the R2 bucket.
       *
       * Decap's own media library commits uploads into the git repository.
       * That is right for small things but wrong for product photography:
       * these are full-resolution camera files, and every one would be in the
       * history of every clone forever. So product photos go to R2 instead,
       * and this replaces the picker for that one field.
       *
       * Registered as a custom media library, which means Decap hands us a
       * `handleInsert` callback and we own the UI. Whatever we pass back is
       * what gets written into the markdown -- a full URL, because Decap also
       * uses that value directly as the <img> src when previewing the photo.
       *
       * Uploads are authorised with the GitHub token this panel already holds:
       * the endpoint asks GitHub whether that token can write to the repo. No
       * second credential, and nothing to configure here.
       */
      const R2 = (() => {
        const el = (tag, attrs = {}, kids = []) => {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (k === 'class') node.className = v;
            else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
            else node.setAttribute(k, v);
          }
          for (const kid of [].concat(kids)) {
            node.append(kid instanceof Node ? kid : document.createTextNode(kid));
          }
          return node;
        };

        const token = () => {
          try {
            return JSON.parse(localStorage.getItem(AUTH_KEY) || '{}').token || '';
          } catch {
            return '';
          }
        };

        const api = async (options = {}) => {
          const response = await fetch('/api/media' + (options.query || ''), {
            method: options.method || 'GET',
            headers: { Authorization: 'Bearer ' + token() },
            body: options.body,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || 'Request failed.');
          return data;
        };

        let root = null;
        let insert = null;

        const close = () => {
          if (root) root.remove();
          root = null;
        };

        const render = (files, error) => {
          close();

          const grid = el('div', { class: 'grid' });
          for (const file of files) {
            const figure = el('figure', {}, [
              el('button', {
                class: 'pick',
                type: 'button',
                title: 'Use this photo',
                onclick: () => {
                  const chosen = file.url;
                  close();
                  if (insert) insert(chosen);
                },
              }, [el('img', { src: file.url, alt: '', loading: 'lazy' })]),
              el('figcaption', {}, file.name),
              el('button', {
                class: 'del',
                type: 'button',
                title: 'Delete from the bucket',
                onclick: async (event) => {
                  event.stopPropagation();
                  if (!confirm(
                    'Delete ' + file.name + '?

' +
                    'If any product still uses this photo, the website will fail to ' +
                    'rebuild until that product is pointed at a different one. Check ' +
                    'first if you are unsure.'
                  )) return;
                  try {
                    await api({ method: 'DELETE', query: '?key=' + encodeURIComponent(file.key) });
                    load();
                  } catch (problem) {
                    render(files, problem.message);
                  }
                },
              }, 'Delete'),
            ]);
            grid.append(figure);
          }

          const picker = el('input', { type: 'file', accept: 'image/*', hidden: 'hidden' });
          const uploadButton = el('button', { class: 'btn', type: 'button', onclick: () => picker.click() }, 'Upload photo');

          picker.addEventListener('change', async () => {
            const file = picker.files && picker.files[0];
            if (!file) return;
            uploadButton.disabled = true;
            uploadButton.textContent = 'Uploading...';
            try {
              const form = new FormData();
              form.append('file', file);
              const saved = await api({ method: 'POST', body: form });
              close();
              if (insert) insert(saved.url);
            } catch (problem) {
              render(files, problem.message);
            }
          });

          root = el('div', { id: 'r2', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Choose a photo' }, [
            el('div', { class: 'panel' }, [
              el('header', {}, [
                el('h2', {}, 'Product photos'),
                uploadButton,
                el('button', { class: 'btn ghost', type: 'button', onclick: close }, 'Cancel'),
              ]),
              ...(error ? [el('p', { class: 'err', role: 'alert' }, error)] : []),
              el('div', { class: 'body' }, [
                files.length
                  ? grid
                  : el('p', { class: 'note' }, 'No photos in the bucket yet. Upload the first one.'),
              ]),
              picker,
            ]),
          ]);

          root.addEventListener('click', (event) => {
            if (event.target === root) close();
          });
          document.addEventListener('keydown', function escape(event) {
            if (event.key === 'Escape') {
              close();
              document.removeEventListener('keydown', escape);
            }
          });

          document.body.append(root);
        };

        const load = async () => {
          try {
            const { files } = await api();
            render(files);
          } catch (problem) {
            render([], problem.message);
          }
        };

        return {
          name: 'r2',
          init: ({ handleInsert }) => ({
            show: () => {
              insert = handleInsert;
              render([], null);
              load();
            },
            hide: close,
            onClearControl: () => {},
            onRemoveControl: () => {},
            enableStandalone: () => false,
          }),
        };
      })();

      window.CMS.registerMediaLibrary(R2);

      /*
       * Decap reads the signed-in user from this localStorage key when it
       * starts. Populating it before init() means the CMS comes up already
       * authenticated and never renders its own "Login with GitHub" screen.
       */
      const screen = document.getElementById('signin');
      const form = document.getElementById('signin-form');
      const errorBox = document.getElementById('signin-error');

      function startCms() {
        screen.remove();
        window.CMS.init(CMS_CONFIG);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const button = form.querySelector('button');
        button.disabled = true;
        button.textContent = 'Signing in…';

        try {
          const response = await fetch('/api/auth', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              Accept: 'application/json',
            },
            body: new URLSearchParams({
              username: form.username.value,
              password: form.password.value,
            }),
          });
          const data = await response.json();

          if (!response.ok) {
            errorBox.textContent = data.error || 'Sign-in failed.';
            errorBox.hidden = false;
            return;
          }

          localStorage.setItem(AUTH_KEY, JSON.stringify({ token: data.token, backendName: 'github' }));
          startCms();
        } catch {
          errorBox.textContent = 'Could not reach the server. Check your connection and try again.';
          errorBox.hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = 'Login';
        }
      });

      // Returning visitor with a stored session: skip the form entirely.
      if (localStorage.getItem(AUTH_KEY)) startCms();
    </script>
  </body>
</html>
